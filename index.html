<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>答える</title>
<style>
:root{--g:#06C755;--bd:#e3e5e8}*{box-sizing:border-box}
body{margin:0;background:#f2f3f5;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#1d1d1f;font-size:14px}
header{background:#fff;padding:12px 14px;font-weight:700;border-bottom:1px solid var(--bd)}
main{padding:12px 12px 120px}.box{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.t{font-weight:700;margin-bottom:6px}.s{color:#444;font-size:13px;line-height:1.6;white-space:pre-wrap}.s b{color:#111}
details summary{font-weight:700;cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1.5px solid var(--bd);background:#fff;border-radius:999px;padding:8px 12px;font-size:14px}
.chip.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
textarea{width:100%;border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;font-size:14px;min-height:40px}
.st{font-size:12.5px;color:#137333;margin-top:6px}.cnt{font-size:12px;color:#666;margin:0 2px 8px}
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:10px 12px 18px}
button.send{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;background:var(--g);color:#fff}
button.send:disabled{background:#b9c2bd}.msg{text-align:center;padding:30px 16px;color:#444}.ok{background:#e7f8ee;color:#137333;font-weight:700;text-align:center}
.to{display:inline-block;font-size:11px;font-weight:400;background:#eef1f5;color:#555;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.as{display:flex;gap:6px;margin:0 2px 10px;flex-wrap:wrap}.as button{border:1.5px solid var(--bd);background:#fff;border-radius:999px;padding:5px 10px;font-size:12px}.as button.on{background:#222;color:#fff;border-color:#222}
.lk{display:block;text-align:center;border:1px solid var(--bd);border-radius:10px;padding:9px;color:#0a66c2;text-decoration:none;margin-top:8px}
.ch{font-weight:700;font-size:13.5px;margin:16px 2px 6px}.hint{font-size:12px;color:#666;text-align:center;margin-top:6px}
.prog{height:5px;background:#e3e5e8;border-radius:9px;overflow:hidden;margin:-4px 2px 10px}.prog b{display:block;height:100%;background:var(--g)}
.filt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.filt button{border:1.5px solid var(--bd);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px}
.filt button.on{background:#222;color:#fff;border-color:#222}
.row{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}.row .rt{font-weight:700;font-size:13.5px;line-height:1.45}
.row .rm{font-size:12px;color:#555;margin-top:5px;line-height:1.55;white-space:pre-wrap}.row button{margin-top:8px;border:0;border-radius:10px;padding:8px 14px;background:var(--g);color:#fff;font-weight:700;font-size:13px}
.lab{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-right:6px;vertical-align:1px}
.l-me{background:var(--g);color:#fff}.l-wait{background:#eef1f5;color:#555}.l-done{background:#f1f3f4;color:#999}
.qb{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:6px;color:#1d1d1f}.qb.on{border-color:var(--g);background:#f3fcf6}
.ans{background:#f3fcf6;border:1px solid #bfe9cf;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.65;margin:-2px 0 8px;white-space:pre-wrap}.ans.no{background:#fff8e1;border-color:#f1d98a}.ans .sm{display:block;color:#666;font-size:11.5px;margin-top:5px;white-space:normal}.ans a{color:#0a66c2}
.tg{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;margin-right:5px;background:#eef1f5;color:#555;font-weight:700}.tr{background:#fde8e7;color:#c5221f}.tgn{background:#e7f8ee;color:#137333}
.bk{display:block;color:#0a66c2;font-size:13px;cursor:pointer;margin-bottom:8px}.lk+button.send,.send2+button.send{margin-top:14px}button.send2{display:block;width:100%;border:1.5px solid var(--g);border-radius:12px;padding:11px;font-size:14.5px;font-weight:700;background:#fff;color:#137333;margin-top:10px}
.spin{width:34px;height:34px;border:4px solid #e3e5e8;border-top-color:var(--g);border-radius:50%;margin:0 auto;animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.inp{width:100%;border:1px solid var(--bd);border-radius:8px;padding:9px;font:inherit;font-size:15px;margin:2px 0 8px;background:#fff}.lab{font-size:11.5px;color:#666}
label.send{display:block;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:var(--g);color:#fff;text-align:center;cursor:pointer}label.send2{display:block;border:1.5px solid var(--g);border-radius:12px;padding:13px;font-size:15px;font-weight:700;background:#fff;color:#137333;text-align:center;cursor:pointer}
</style></head><body>
<header id="hd">読み込み中…</header><main id="mn"><div class="msg">読み込み中…</div></main><footer id="ft" hidden><button class="send" id="sd" disabled>送信</button><div class="hint" id="hn"></div></footer>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID="2012262067-htwZvG1K";
const API="https://script.google.com/macros/s/AKfycbyF0FALqdPvnhmYA2dwkvCKhSQ_b-k2Vyh1X7dkx-iiMXQ4FVmWPBvEPWQlQ3N6nOGrDQ/exec?a=liff";
const $=id=>document.getElementById(id),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null,sel={},note={},qid="",asWho="";
const AT={"江藤":"@Yuu","ウンパ":"@村井亮介","大川":"@Tas"};
function err(m){$("hd").textContent="答える";$("mn").innerHTML='<div class="msg">'+esc(m)+'</div>';$("ft").hidden=true}
async function api(o){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(Object.assign({idToken:liff.getIDToken(),q:qid},o))});return r.json()}
function rowsHtml(rs){return (rs||[]).map(r=>r[0]?'<b>【'+esc(String(r[0]).replace(/^ー/,""))+'】</b>\n'+esc(r[1]):esc(r[1])).join("\n")}
function stateOf(q){const x=(D.state||[]).find(y=>y.q===q);return x&&x.a.length?x.a.map(a=>a.v+"（"+a.who+"）").join("／"):""}
function draw(){
 $("hd").textContent=D.short||D.head||"答える";
 let h="";
 const sm=(D.summary||[]).map(c=>(c.text?esc(c.text)+"\n":"")+rowsHtml(c.rows)).join("\n").trim();
 if(sm)h+='<div class="box"><details open><summary>案件の概要</summary><div class="s" style="margin-top:6px">'+sm+'</div></details></div>';
 if(D.who==="大川"){const ws=[...new Set(D.qs.map(q=>q.to).filter(Boolean))];if(ws.length>1)h+='<div class="as"><span class="cnt" style="margin:4px 0">試しに：</span>'+['',...ws].map(w=>'<button data-as="'+w+'" class="'+(asWho===w?"on":"")+'">'+(w?(AT[w]||w)+" として":"全部")+'</button>').join("")+'</div>';}
 const qs=D.qs.filter(q=>!asWho||!q.to||q.to===asWho).filter(q=>!q.when||(stateOf(q.when.q)||"").indexOf(q.when.v)===0||sel[D.qs.find(y=>y.q===q.when.q)?.k]===q.when.v);
 h+='<div class="cnt">あなたへの問い '+qs.length+'問</div>';
 qs.forEach(q=>{
  const bg=((q.text?esc(q.text)+"\n":"")+rowsHtml(q.rows)).trim(),st=stateOf(q.q);
  h+='<div class="box"><div class="t">'+(q.to&&D.who==="大川"?'<span class="to">'+esc(AT[q.to]||q.to)+' あて</span>':"")+esc(q.q)+'</div>'+(bg?'<div class="s">'+bg+'</div>':"")+'<div class="chips">'+q.btns.map(b=>'<button class="chip'+(sel[q.k]===b?" on":"")+'" data-k="'+q.k+'" data-v="'+esc(b)+'">'+esc(b)+'</button>').join("")+'</div>'
   +'<textarea placeholder="ひとこと（任意）" data-n="'+q.k+'">'+esc(note[q.k]||"")+'</textarea>'+(st?'<div class="st">いまの答え：'+esc(st)+'</div>':"")+'</div>';
 });
 (D.summary||[]).filter(c=>c.link).slice(0,1).forEach(c=>{h+='<a class="lk" href="'+esc(c.link)+'" target="_blank">🔗 この案件の詳細・履歴</a>'});
 h+='<a class="lk" href="'+location.pathname+'?v=ask&q='+encodeURIComponent(qid)+'">❓ この件で聞く</a>';
 $("mn").innerHTML=h;$("ft").hidden=false;
 document.querySelectorAll("[data-as]").forEach(b=>b.onclick=()=>{asWho=b.dataset.as;draw()});
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const k=b.dataset.k;sel[k]=sel[k]===b.dataset.v?undefined:b.dataset.v;draw()});
 document.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{note[t.dataset.n]=t.value;upd()});
 upd();
}
function upd(){const n=Object.keys(sel).filter(k=>sel[k]||note[k]).length;$("sd").disabled=!n;$("sd").textContent=n?"送信（"+n+"問）":"選んでください"}
$("sd").onclick=async()=>{
 $("sd").disabled=true;$("sd").textContent="送っています…";
 try{
  const answers=Object.keys(Object.assign({},sel,note)).filter(k=>sel[k]||note[k]).map(k=>({k:+k,v:sel[k]||"その他",note:note[k]||""}));
  const r=await api({op:"ans",answers});if(!r.ok)return err(r.err);
  const ctx=liff.getContext()||{};
  let text="";
  if(r.doneText)text=r.doneText;
  else if(ctx.type==="utou")text=(D.short||D.head||"")+"\n"+answers.map(a=>{const q=D.qs.find(x=>x.k===a.k);return (q?(q.label||q.q):"")+"："+a.v+(a.note?"（"+a.note+"）":"")}).join("\n");
  let sent=false;if(text&&liff.isInClient()){try{await liff.sendMessages([{type:"text",text:text.slice(0,4900)}]);sent=true}catch(e){}}
  D=r;$("ft").hidden=true;
  $("mn").innerHTML='<div class="box ok">送信しました</div><div class="box"><div class="t">いまの状況</div><div class="s">'+r.state.map(x=>(x.a.length?"✅ ":"⬜ ")+esc(x.q)+(x.a.length?"："+esc(x.a.map(a=>a.v+"（"+a.who+"）").join("／")):"")).join("\n")+'</div></div>'
   +'<div class="msg">'+(r.done?"全部そろいました。"+(sent?"トークにまとめを出しました":""):"ほかの人の答えを待っています（トークには何も出ていません）")+'</div>'
   +(liff.isInClient()?'<button class="send" onclick="liff.closeWindow()">閉じる</button>':"");
 }catch(e){err("送れませんでした："+e.message)}
};
/* ---- 下のメニュー（v=todo まだ答えていない問い・v=list 大川からの質問一覧・v=ask 質問する） ---- */
let M=null,mSel={},mNote={},mBusy=false,mLf="";
function mClose(){return liff.isInClient&&liff.isInClient()?'<button class="send" onclick="liff.closeWindow()">閉じる</button>':""}
function mStOf(state,q){const x=(state||[]).find(y=>y.q===q);return x&&x.a.length?x.a.map(a=>a.v+"（"+a.who+"）").join("／"):""}
function mSum(summary){return (summary||[]).map(c=>(c.text?esc(c.text)+"\n":"")+rowsHtml(c.rows)).join("\n").trim()}
function mPicked(){return Object.keys(Object.assign({},mSel,mNote)).filter(k=>mSel[k]||mNote[k])}
function mUpd(){const n=mPicked().length;$("sd").disabled=!n||mBusy;$("sd").textContent=mBusy?"送っています…":n?"送信（"+n+"問）":"選んでください"}
function mShown(c){return c.qs.filter(q=>{if(c.open.indexOf(q.k)>=0)return true;if(!q.when)return false;const p=c.qs.find(y=>y.q===q.when.q);if(!p||c.open.indexOf(p.k)<0)return false;return (mSel[c.qid+"|"+p.k]||"").indexOf(q.when.v)===0})}
function mTodo(){
 const cs=M.cases||[];$("hd").textContent="まだ答えていない問い（"+cs.length+"件）";
 if(!cs.length){$("mn").innerHTML='<div class="box ok">まだ答えていない問いはありません</div><div class="msg">大川から聞きたいことが来たら、このトークにカードが届きます</div>'+mClose();$("ft").hidden=true;return}
 let h="",total=0,got=0;
 cs.forEach(c=>{
  const qs=mShown(c);
  c.qs.forEach(q=>{if(qs.indexOf(q)<0){delete mSel[c.qid+"|"+q.k];delete mNote[c.qid+"|"+q.k]}});
  h+='<div class="ch">'+esc(c.head)+'</div>';
  const sm=mSum(c.summary),lk=(c.summary||[]).find(x=>x.link);
  if(sm||lk)h+='<div class="box">'+(sm?'<details'+(cs.length===1?" open":"")+'><summary>案件の概要</summary><div class="s" style="margin-top:6px">'+sm+'</div></details>':"")+(lk?'<a class="lk" href="'+esc(lk.link)+'" target="_blank">🔗 この案件の詳細・履歴</a>':"")+'</div>';
  qs.forEach(q=>{const key=c.qid+"|"+q.k;total++;if(mSel[key]||mNote[key])got++;
   const bg=((q.text?esc(q.text)+"\n":"")+rowsHtml(q.rows)).trim(),st=mStOf(c.state,q.q);
   h+='<div class="box"><div class="t">'+esc(q.q)+'</div>'+(bg?'<div class="s">'+bg+'</div>':"")+'<div class="chips">'+q.btns.map(b=>'<button class="chip'+(mSel[key]===b?" on":"")+'" data-mk="'+key+'" data-v="'+esc(b)+'">'+esc(b)+'</button>').join("")+'</div>'
    +'<textarea placeholder="ひとこと（任意）" data-mn="'+key+'">'+esc(mNote[key]||"")+'</textarea>'+(st?'<div class="st">いまの答え：'+esc(st)+'</div>':"")+'</div>'});
 });
 $("mn").innerHTML='<div class="cnt">'+total+'問中 '+got+'問</div><div class="prog"><b style="width:'+(total?got/total*100:0)+'%"></b></div>'+h;
 $("ft").hidden=false;$("hn").textContent=got<total?"答えた問いだけ先に送れます。残りはまたこのメニューから":"全部そろいました";
 document.querySelectorAll("[data-mk]").forEach(b=>b.onclick=()=>{const k=b.dataset.mk;mSel[k]=mSel[k]===b.dataset.v?undefined:b.dataset.v;mTodo()});
 document.querySelectorAll("[data-mn]").forEach(t=>t.oninput=()=>{mNote[t.dataset.mn]=t.value;mUpd()});
 mUpd();
}
async function mSend(){
 if(mBusy)return;mBusy=true;mUpd();
 try{
  const by={};mPicked().forEach(key=>{const i=key.lastIndexOf("|"),q=key.slice(0,i),k=+key.slice(i+1);(by[q]=by[q]||[]).push({k,v:mSel[key]||"その他",note:mNote[key]||""})});
  const items=Object.keys(by).map(q=>({q,answers:by[q]}));
  const r=await api({op:"ansMany",items});if(!r.ok){mBusy=false;return err(r.err)}
  const lines=(r.doneTexts||[]).slice(),doneQ={};
  items.forEach(it=>{const c=(M.cases||[]).find(x=>x.qid===it.q);if(!c)return;const still=(r.cases||[]).some(x=>x.qid===c.qid);
   if(!still&&(r.doneTexts||[]).length&&lines.some(t=>t.indexOf(" そろいました")>0&&t.indexOf(c.head)>=0))return;
   lines.push(c.head+"\n"+it.answers.map(a=>{const q=c.qs.find(x=>x.k===a.k);return (q?(q.label||q.q):"")+"："+a.v+(a.note?"（"+a.note+"）":"")}).join("\n"))});
  let sent=false;const text=lines.join("\n\n");
  if(text&&liff.isInClient()){try{await liff.sendMessages([{type:"text",text:text.slice(0,4900)}]);sent=true}catch(e){}}
  mSel={};mNote={};M=r;$("ft").hidden=true;const left=(r.cases||[]).length;
  $("mn").innerHTML='<div class="box ok">送信しました（'+(r.sent||0)+'件）</div>'+(sent?'<div class="msg">トークに答えを出しました</div>':"")
   +(left?'<div class="msg">まだ答えていない問いが '+left+'件 あります</div><button class="send" id="more">続けて答える</button><div style="height:8px"></div>':'<div class="msg">まだ答えていない問いはもうありません</div>')+mClose();
  if(left)$("more").onclick=()=>mTodo();
 }catch(e){err("送れませんでした："+e.message)}
 mBusy=false;
}
function mList(){
 const L=M.list||[];$("hd").textContent="大川からの質問一覧";$("ft").hidden=true;
 const cnt=k=>k==="all"?L.length:L.filter(x=>x.label===k).length;
 if(!mLf)mLf=cnt("あなたの番")?"あなたの番":"all";
 const F=[["あなたの番","あなたの番"],["待ち","待ち"],["完了","完了"],["all","全部"]],cls={"あなたの番":"l-me","待ち":"l-wait","完了":"l-done"};
 const rows=L.filter(x=>mLf==="all"||x.label===mLf);
 $("mn").innerHTML='<div class="filt">'+F.map(([k,v])=>'<button data-f="'+k+'" class="'+(mLf===k?"on":"")+'">'+v+'（'+cnt(k)+'）</button>').join("")+'</div>'
  +(rows.length?rows.map(x=>'<div class="row"><div class="rt"><span class="lab '+cls[x.label]+'">'+esc(x.label)+'</span>'+esc(x.head)+'</div><div class="rm">'
   +x.state.map(y=>(y.a.length?"✅ ":"⬜ ")+esc(y.q)+(y.a.length?"："+esc(y.a.map(a=>a.v+"（"+a.who+"）").join("／")):(y.to?"（"+esc(AT[y.to]||y.to)+"）":""))).join("\n")+'</div>'
   +(x.label==="あなたの番"?(x.mine1?'<button data-q="'+esc(x.qid)+'">答える（'+x.open+'問）</button>':'<div class="rm" style="color:#888">グループのカードの［答える］から答えてください</div>'):"")+'</div>').join(""):'<div class="msg">ありません</div>')+mClose();
 document.querySelectorAll(".filt button").forEach(b=>b.onclick=()=>{mLf=b.dataset.f;mList()});
 document.querySelectorAll(".row button[data-q]").forEach(b=>b.onclick=()=>{location.href=location.pathname+"?q="+encodeURIComponent(b.dataset.q)});
}
/* ---- 質問する（カードの中身から答える・ほかは大川さんへ） ---- */
let aQ="",aPick="",aBusy=false,aTxt="",aDone=false;
const AK=[["due",/いつまで|期限|締切|〆/],["money",/いくら|金額|予算|費用|ギャラ|円|料金/],["from",/誰から|どこから|先方|クライアント|代理店|窓口|誰の/],["what",/何を|何本|内容|中身|やること|何する/],["when",/いつ|日程|何日|何時|時期|平日|週末|撮影日/],["now",/どこまで|進み|状況|決まっ/]];
const AR={due:/期限|締切|返答/,when:/実施|時期|公開|大会|撮影|日程/,what:/中身|やること|ほしいもの|希望|内容/,money:/予算|金額|定額|売上|本体|費|円/};
const ACH=[["いつ撮る？","撮影はいつですか？"],["いくら？","金額はいくらですか？"],["何をする？","何をするのですか？"],["先方は誰？","先方はどこの誰ですか？"]];
function aDue(x){const h=String((x.facts&&x.facts.head)||x.head||"");return((h.match(/^🚨([^｜|]*)/)||[])[1]||"").trim()}
function aFacts(x){const f=x.facts||{},h=String(f.head||x.head||""),A={},used={};
 const rows=(f.rows||[]).map(r=>[String(r[0]||"").replace(/^ー/,"").trim(),String(r[1]||"")]).filter(r=>r[0]&&r[1]&&r[0].indexOf("@")<0);
 const pick=k=>rows.filter((r,i)=>!used[i]&&AR[k].test(r[0])&&(used[i]=1)).map(r=>r[0]+"："+r[1]).join("\n");
 const due=aDue(x),pd=pick("due");A.due=[due&&"期限："+due,pd].filter(Boolean).join("\n");
 ["when","what","money"].forEach(k=>A[k]=pick(k));if(!A.what&&f.text)A.what=String(f.text);
 const fr=(h.match(/（([^（）]*)）\s*$/)||[])[1];if(fr){const p=fr.split(/\s*[／\/]\s*/);A.from=p.length>1?"エンドは "+p[0]+"、窓口は "+p.slice(1).join("・")+" さん":p[0]}
 A.now=(x.state||[]).map(y=>(y.a&&y.a.length?"✅ "+y.q+"："+y.a.map(a=>a.v).join("／"):"⬜ "+y.q+"（"+({"江藤":"江藤さん","ウンパ":"村井さん","大川":"大川さん"}[y.to]||"みなさん")+"の答え待ち）")).join("\n");
 return A}
function aHint(x,t){if(!x||!t)return "";const A=aFacts(x);const ks=[];AK.forEach(k=>{if(k[1].test(t)&&!(k[0]==="when"&&ks.indexOf("due")>=0))ks.push(k[0])});return ks.map(k=>A[k]).filter(Boolean).join("\n")}
function aLine(x){const A=aFacts(x),o=[];const d=aDue(x);if(d)o.push(d);if(A.from)o.push(A.from.replace(/^エンドは /,"").replace(/、窓口は /,"・"));const m=(A.money||"").split("\n")[0];if(m)o.push(m);return o.join(" ／ ")}
function mAsk(){
 const A0=M.list||[],L=A0.filter(x=>x.label!=="完了");$("ft").hidden=true;
 const x=aQ&&(A0.find(y=>y.qid===aQ)||{qid:aQ,short:"",head:"",facts:null,state:[]});const px=!x&&aPick&&L.find(y=>y.qid===aPick);const cx=x||px;
 let h="";
 if(x){$("hd").textContent=(x.short||x.head)?(x.short||x.head)+" について聞く":"この件について聞く";const ln=aLine(x);if(ln)h+='<div class="cnt">'+esc(ln)+'</div>'}
 else{$("hd").textContent="大川さんに聞く"}
 h+='<textarea id="at" placeholder="'+(x?"例：撮影は平日ですか？":"例：来週の水曜、午後あいてますか？")+'" style="min-height:80px;border:1.5px solid var(--g)">'+esc(aTxt)+'</textarea>';
 if(x)h+='<div class="chips">'+ACH.map((c,i)=>'<button class="chip" data-ac="'+i+'">'+esc(c[0])+'</button>').join("")+'</div>';
 else{const rc=L.slice().sort((a,b)=>String(b.at||"").localeCompare(String(a.at||""))).slice(0,5);
  h+='<div class="cnt" style="margin-top:10px">どの件のこと？（なくてもOK）</div><div class="chips">'+rc.map(y=>'<button class="chip'+(aPick===y.qid?" on":"")+'" data-ap="'+esc(y.qid)+'">'+esc(y.short||y.head)+'</button>').join("")+'<button class="chip'+(!aPick?" on":"")+'" data-ap="">件に関係ない</button></div>'}
 h+='<div id="ah"></div><button class="send" id="as" style="margin-top:8px">大川さんに送る</button><div id="ax"></div><div class="hint">返事はこのトークに来ます</div>';
 if(x&&x.label==="あなたの番"&&x.mine1)h+='<a class="lk" href="'+location.pathname+'?q='+encodeURIComponent(x.qid)+'">この件の問いに答える（'+x.open+'問）</a>';
 if(cx&&cx.facts&&cx.facts.link)h+='<a class="lk" href="'+esc(cx.facts.link)+'" target="_blank">🔗 この案件の詳細・履歴</a>';
 $("mn").innerHTML=h+mClose();
 const ta=$("at");
 const hint=()=>{const v=aHint(cx,ta.value);$("ah").innerHTML=v?'<div class="ans no" style="margin-top:8px"><b>表にはこうあります</b>\n'+esc(v)+'<span class="sm">これで分かれば、送らなくて大丈夫です</span></div>':"";$("as").textContent=v?"それでも大川さんに送る":"大川さんに送る";$("ax").innerHTML=v&&liff.isInClient()?'<button class="send2" onclick="liff.closeWindow()">分かった・閉じる</button>':""};
 ta.oninput=()=>{aTxt=ta.value;hint()};hint();
 document.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{aTxt=ACH[+b.dataset.ac][1];ta.value=aTxt;hint();ta.focus()});
 document.querySelectorAll("[data-ap]").forEach(b=>b.onclick=()=>{aPick=b.dataset.ap;aTxt=ta.value;mAsk()});
 $("as").onclick=async()=>{const t=ta.value.trim();if(!t){ta.focus();return}if(aBusy)return;aBusy=true;$("as").disabled=true;$("as").textContent="送っています…";
  try{const r=await api({op:"askq",q:cx?cx.qid:"",text:t});if(!r.ok){aBusy=false;return err(r.err)}aTxt="";
   $("mn").innerHTML='<div class="box ok">大川さんに送りました</div><div class="msg">'+(r.name?esc(r.name)+" の件として届きました。":"")+'返事はこのトークに来ます</div>'+mClose()}catch(e){err("送れませんでした："+e.message)}aBusy=false};
}
let X={items:[],cs:[],kinds:[],live:false,who:"",busy:false,all:""};
function xRid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function xPick(){X={items:[],cs:[],kinds:[],live:false,who:"",busy:false,all:""};$("hd").textContent="経費を送る";$("ft").hidden=true;
 $("mn").innerHTML='<div class="box"><div class="t">🧾 領収書を送る</div><div class="s">写真かPDFを選ぶと、日付・店・金額を読み取ります。<b>何枚でもまとめて選べます</b>。読み間違いはこのあと直せます</div></div>'
 +'<label class="send" style="display:block;text-align:center;margin-bottom:10px">📷 撮る<input id="xc" type="file" accept="image/*" capture="environment" hidden></label>'
 +'<label class="send2" style="display:block;text-align:center">🖼 写真・PDF を選ぶ（何枚でも）<input id="xf" type="file" accept="image/*,application/pdf" multiple hidden></label>'+mClose();
 ["xc","xf"].forEach(id=>$(id).onchange=e=>{const fs=Array.from(e.target.files||[]);if(fs.length)xLoad(fs)});}
function xShrink(file){return new Promise((ok,ng)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);const d=c.toDataURL("image/jpeg",0.82);URL.revokeObjectURL(u);ok(d)};im.onerror=()=>ng(new Error("写真を開けませんでした"));im.src=u})}
function xB64(file){return new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(String(r.result));r.onerror=()=>ng(new Error("ファイルを読めませんでした"));r.readAsDataURL(file)})}
function xProg(i,n,img){$("mn").innerHTML=(img?'<img src="'+img+'" style="width:100%;max-height:200px;object-fit:contain;border-radius:10px;background:#fff;margin-bottom:10px">':'')+'<div class="box" style="text-align:center"><div class="spin"></div><div class="t" style="margin-top:8px">読み取り中…'+(n>1?'（'+n+'枚中 '+(i+1)+'枚目）':'')+'</div><div class="s">1枚10秒ほどかかります。このままお待ちください</div>'+(n>1?'<div class="prog" style="margin-top:10px"><b style="width:'+Math.round(i/n*100)+'%"></b></div>':'')+'</div>'}
async function xLoad(files){
 if(X.busy)return;X.busy=true;files=files.slice(0,10);
 for(let i=0;i<files.length;i++){const file=files[i];const it={name:file.name,rid:xRid(),cid:"",st:"",err:""};
  try{let d;if(/pdf/.test(file.type)){if(file.size>8e6)throw new Error("PDFが大きすぎます（8MBまで）");d=await xB64(file);it.mime="application/pdf";it.img=""}else{d=await xShrink(file);it.mime="image/jpeg";it.img=d}
   it.b64=d.split(",")[1];xProg(i,files.length,it.img);
   const r=await api({op:"expread",b64:it.b64,mime:it.mime});
   if(!r.ok){it.err=r.err;it.r={d:"",to:"",a:"",t:"",k:"",cur:"JPY"}}else{it.r=r.r;(r.cs||[]).forEach(c=>{if(!X.cs.find(y=>y.id===c.id))X.cs.push(c)});X.live=r.live;X.kinds=r.kinds||X.kinds;X.who=r.who}
  }catch(e){it.err=e.message;it.r={d:"",to:"",a:"",t:"",k:"",cur:"JPY"}}
  X.items.push(it);}
 X.busy=false;xForm();}
function xCard(it,i){const r=it.r,n=X.items.length,sent=it.st==="ok";
 if(sent)return '<div class="box" style="background:#e7f8ee"><b>✅ '+(n>1?(i+1)+'. ':'')+esc(it.line||"")+'</b>'+(it.cname?'<span class="s">（'+esc(it.cname)+'）</span>':'')+'</div>';
 return '<div class="box" data-i="'+i+'">'+(n>1?'<div class="t">'+(i+1)+'枚目</div>':'')+(it.img?'<img src="'+it.img+'" style="width:100%;max-height:150px;object-fit:contain;border-radius:8px;background:#f6f7f8;margin-bottom:6px">':'<div class="s">📄 '+esc(it.name)+'</div>')
 +(it.err?'<div class="s" style="color:#c5221f;font-weight:700">'+esc(it.err)+'（手で入れてください）</div>':'')
 +'<div class="lab">日付</div><input data-f="d" type="date" value="'+esc(r.d)+'" class="inp">'
 +'<div class="lab">店・支払い先</div><input data-f="to" value="'+esc(r.to)+'" class="inp">'
 +'<div class="lab">金額'+(r.cur&&r.cur!=="JPY"?'（'+esc(r.cur)+'）':'（円）')+'</div><input data-f="a" type="number" inputmode="decimal" value="'+esc(r.a)+'" class="inp">'
 +'<div class="lab">何に使ったか</div><input data-f="t" value="'+esc(r.t)+'" class="inp">'
 +'<div class="lab">費目</div><input data-f="k" value="'+esc(r.k)+'" class="inp" list="xkl">'
 +(n>1?'<div class="lab">どの件？</div><div class="chips">'+X.cs.map(c=>'<button class="chip'+(it.cid===c.id?" on":"")+'" data-ci="'+i+'" data-xc="'+esc(c.id)+'">'+esc(c.name)+'</button>').join("")+'<button class="chip'+(it.cid==="-"?" on":"")+'" data-ci="'+i+'" data-xc="-">件と関係ない</button></div>':'')
 +(n>1?'<button class="chip" data-del="'+i+'" style="margin-top:4px;color:#c5221f">この1枚は送らない</button>':'')
 +(it.st==="ng"?'<div class="s" style="color:#c5221f;font-weight:700">送れませんでした：'+esc(it.err2||"")+'</div>':'')+'</div>'}
function xForm(){const n=X.items.length;if(!n)return xPick();
 const left=X.items.filter(it=>it.st!=="ok");
 let h='<div class="box"><div class="t">'+(n>1?n+'枚 読み取りました':'読み取りました')+(X.live?'':'<span class="s">（試し）</span>')+'</div><div class="s">違うところは直してください</div></div><datalist id="xkl">'+X.kinds.map(k=>'<option value="'+esc(k)+'">').join("")+'</datalist>';
 if(left.length)h+='<div class="cnt">'+(n>1?'どの件の経費？（全部に）':'どの件の経費？')+'</div><div class="chips">'+X.cs.map(c=>'<button class="chip'+(X.all===c.id?" on":"")+'" data-xa="'+esc(c.id)+'">'+esc(c.name)+'</button>').join("")+'<button class="chip'+(X.all==="-"?" on":"")+'" data-xa="-">件と関係ない・分からない</button></div>';
 h+=X.items.map(xCard).join("");
 if(X.who==="江藤")h+='<div class="s" style="margin:4px 2px 8px">案件のコストとして付けます（申請は江藤さんご自身で）</div>';
 if(left.length)h+='<button class="send" id="xs">'+(left.length>1?'まとめて送る（'+left.length+'枚）':'送る')+'</button><button class="send2" onclick="xPick()">選び直す</button>';
 else h+='<div class="box ok">✅ 全部受け取りました</div><div class="s" style="margin:0 2px 8px">'+(X.who==="江藤"?'案件のコストとして付けました（申請は江藤さんご自身で）':'大川さんが確かめたら、月末のお支払いで精算します')+(X.live?'':'<br>【試し】経費タブにはまだ書いていません')+'</div><button class="send" onclick="xPick()">もっと送る</button>';
 $("mn").innerHTML=h+mClose();
 document.querySelectorAll("[data-xa]").forEach(b=>b.onclick=()=>{xKeep();X.all=b.dataset.xa;X.items.forEach(it=>{if(it.st!=="ok")it.cid=X.all});xForm()});
 document.querySelectorAll("[data-xc]").forEach(b=>b.onclick=()=>{xKeep();X.items[+b.dataset.ci].cid=b.dataset.xc;X.all="";xForm()});
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{xKeep();X.items.splice(+b.dataset.del,1);xForm()});
 const s=$("xs");if(s)s.onclick=xSend;}
function xKeep(){document.querySelectorAll(".box[data-i]").forEach(bx=>{const it=X.items[+bx.dataset.i];if(!it)return;const g=f=>{const e=bx.querySelector('[data-f="'+f+'"]');return e?e.value.trim():""};it.r=Object.assign({},it.r,{d:g("d"),to:g("to"),a:g("a"),t:g("t"),k:g("k")})})}
async function xSend(){if(X.busy)return;xKeep();
 const left=X.items.filter(it=>it.st!=="ok");
 const noCase=left.filter(it=>!it.cid);if(X.items.length===1&&X.all&&!left[0].cid)left[0].cid=X.all;
 if(left.some(it=>!it.cid)){alertBox("どの件の経費か選んでください"+(X.items.length>1?"（上の「全部に」でまとめて選べます）":""));return}
 X.busy=true;const b=$("xs");b.disabled=true;
 for(let i=0;i<left.length;i++){const it=left[i];b.textContent="送っています…"+(left.length>1?"（"+(i+1)+"/"+left.length+"）":"");
  const c=X.cs.find(y=>y.id===it.cid);
  try{const r=await api({op:"expsave",rid:it.rid,b64:it.b64,mime:it.mime,r:it.r,cid:it.cid==="-"?"":it.cid,cname:c?c.name:""});
   if(r.ok){it.st="ok";it.line=r.line;it.cname=r.name}else{it.st="ng";it.err2=r.err}}catch(e){it.st="ng";it.err2=e.message}}
 X.busy=false;xForm();window.scrollTo(0,0);}
function alertBox(m){let a=$("xa_msg");if(!a){a=document.createElement("div");a.id="xa_msg";a.className="box";a.style.cssText="border-color:#f3b8b4;background:#fde8e7;color:#c5221f;font-weight:700";$("mn").prepend(a)}a.textContent=m;window.scrollTo(0,0)}
async function mStart(v){
 if(v==="ask"){const r=await api({op:"list"});if(!r.ok)return err(r.err);M=r;return mAsk()}
 const r=await api({op:v});if(!r.ok)return err(r.err);M=r;
 if(v==="todo"){$("sd").onclick=mSend;mTodo()}else mList();
}
(async()=>{
 try{
  await liff.init({liffId:LIFF_ID,withLoginOnExternalBrowser:true});
  const P=new URLSearchParams(location.search);qid=P.get("q")||"";const V=P.get("v")||"";
  if(V==="ask"){aQ=qid;return mStart(V)}
  if(V==="exp")return xPick();
  if(!qid&&(V==="todo"||V==="list"))return mStart(V);
  if(!qid)return err("件の番号がありません（カードの［答える］から開いてください）");
  const r=await api({op:"load"});if(!r.ok)return err(r.err);
  D=r;if(!D.qs.length)return err("この件に、あなたへの問いはありません");draw();
 }catch(e){err("開けませんでした："+e.message)}
})();
</script></body></html>
